<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1000" height="660" rx="16" fill="#f8fafc"/>
  <rect width="1000" height="5" rx="2" fill="url(#accent)"/>
  <text x="34" y="44" font-size="22" font-weight="800" fill="#0f172a">Tranzor Helper — layered architecture</text>
  <text x="34" y="68" font-size="13.5" fill="#64748b">Thin tkinter UI · pure-Python logic core (unit-tested headless) · local SQLite cache · read-only remote sources</text>

  <!-- UI LAYER -->
  <rect x="34" y="90" width="932" height="150" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="52" y="116" font-size="14" font-weight="800" fill="#4338ca">① PRESENTATION  ·  tkinter / ttk.Notebook</text>
  <g font-size="11.5" font-weight="600">
    <g fill="#3730a3">
      <rect x="52" y="128" width="150" height="30" rx="7" fill="#fff" stroke="#c7d2fe"/><text x="62" y="148">export_gui.py · root + boot</text>
      <rect x="212" y="128" width="120" height="30" rx="7" fill="#fff" stroke="#c7d2fe"/><text x="222" y="148">gui_tabs.py</text>
      <rect x="342" y="128" width="180" height="30" rx="7" fill="#fff" stroke="#c7d2fe"/><text x="352" y="148">11 × gui_tab_*.py (1 file/tab)</text>
      <rect x="532" y="128" width="140" height="30" rx="7" fill="#fff" stroke="#c7d2fe"/><text x="542" y="148">advanced_filter.py</text>
      <rect x="682" y="128" width="120" height="30" rx="7" fill="#fff" stroke="#c7d2fe"/><text x="692" y="148">date_picker.py</text>
    </g>
    <text x="52" y="180" font-size="11" fill="#6366f1">14 tabs · lazy first-paint · optional &amp; fail-safe (a broken tab never crashes the app) · EN/中文 toggle</text>
  </g>
  <!-- pure logic sub-band -->
  <rect x="52" y="190" width="896" height="40" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="64" y="206" font-size="11.5" font-weight="800" fill="#7c3aed">PURE LOGIC CORE (no tkinter — this is what the 44 tests cover)</text>
  <g font-size="10.5" fill="#6b21a8">
    <text x="64" y="222">same_origin · terminology_watchtower · terminology_highlight · tranzor_truncation · task_post_edit · quality_overview · pretranslation_check · opus_search</text>
  </g>

  <!-- arrows UI->service -->
  <line x1="500" y1="240" x2="500" y2="268" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- SERVICE LAYER -->
  <rect x="34" y="270" width="932" height="132" rx="14" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
  <text x="52" y="296" font-size="14" font-weight="800" fill="#0e7490">② SERVICE / CLIENT  ·  background threads · ThreadPoolExecutor (4–8) · retry + backoff</text>
  <g font-size="11.5" font-weight="600" fill="#155e75">
    <rect x="52" y="308" width="190" height="34" rx="7" fill="#fff" stroke="#a5f3fc"/><text x="62" y="330">export_mr_pipeline.py (mr_api)</text>
    <rect x="252" y="308" width="200" height="34" rx="7" fill="#fff" stroke="#a5f3fc"/><text x="262" y="330">export_translations.py (legacy_api)</text>
    <rect x="462" y="308" width="140" height="34" rx="7" fill="#fff" stroke="#a5f3fc"/><text x="472" y="330">gitlab_client.py</text>
    <rect x="612" y="308" width="150" height="34" rx="7" fill="#fff" stroke="#a5f3fc"/><text x="622" y="330">tranzor_auth.py (JWT)</text>
    <rect x="772" y="308" width="176" height="34" rx="7" fill="#fff" stroke="#a5f3fc"/><text x="782" y="330">repo_corpus.py (ingest)</text>
    <rect x="52" y="352" width="170" height="34" rx="7" fill="#fff" stroke="#a5f3fc"/><text x="62" y="374">opus_id_monitor.py (sync)</text>
    <rect x="232" y="352" width="150" height="34" rx="7" fill="#fff" stroke="#a5f3fc"/><text x="242" y="374">tranzor_checks.py</text>
    <rect x="392" y="352" width="210" height="34" rx="7" fill="#fff" stroke="#a5f3fc"/><text x="402" y="374">tranzor_bridge.py (loopback HTTP)</text>
    <rect x="612" y="352" width="160" height="34" rx="7" fill="#fff" stroke="#a5f3fc"/><text x="622" y="374">merge_watchdog.py</text>
  </g>

  <!-- arrows service->data -->
  <line x1="240" y1="402" x2="240" y2="430" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="760" y1="402" x2="760" y2="430" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- DATA LAYER -->
  <rect x="34" y="432" width="450" height="190" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="52" y="458" font-size="14" font-weight="800" fill="#15803d">③ LOCAL DATA  ·  ~/.tranzor_exporter/</text>
  <rect x="52" y="470" width="180" height="56" rx="9" fill="#fff" stroke="#bbf7d0"/>
  <text x="64" y="492" font-size="12" font-weight="700" fill="#166534">opus_index.db</text>
  <text x="64" y="512" font-size="10.5" fill="#16a34a">SQLite · WAL · ~1.27M rows</text>
  <rect x="244" y="470" width="170" height="56" rx="9" fill="#fff" stroke="#bbf7d0"/>
  <text x="256" y="492" font-size="12" font-weight="700" fill="#166534">checks_index.db</text>
  <text x="256" y="512" font-size="10.5" fill="#16a34a">issue-level QA cache</text>
  <text x="52" y="552" font-size="11" fill="#15803d">Offline-first: every tab's first paint is a pure local read — no network round-trip.</text>
  <text x="52" y="574" font-size="11" fill="#15803d">Incremental sync by created_at watermark; full re-sync on demand.</text>
  <rect x="52" y="586" width="362" height="24" rx="7" fill="#dcfce7"/>
  <text x="64" y="602" font-size="10.5" font-weight="700" fill="#166534">+ token/config JSON (chmod 600) · products.json registry</text>

  <!-- REMOTE -->
  <rect x="516" y="432" width="450" height="190" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="534" y="458" font-size="14" font-weight="800" fill="#c2410c">REMOTE (read-only)</text>
  <rect x="534" y="470" width="414" height="40" rx="9" fill="#fff" stroke="#fed7aa"/>
  <text x="546" y="488" font-size="12" font-weight="700" fill="#9a3412">Tranzor / XTM platform API  ·  /api/v1 + /api/v1/legacy</text>
  <text x="546" y="503" font-size="10.5" fill="#ea580c">Bearer JWT · latest increments Tranzor processed</text>
  <rect x="534" y="518" width="414" height="40" rx="9" fill="#fff" stroke="#fed7aa"/>
  <text x="546" y="536" font-size="12" font-weight="700" fill="#9a3412">RingCentral GitLab product repos  ·  /api/v4</text>
  <text x="546" y="551" font-size="10.5" fill="#ea580c">the new "latest + fullest" source of truth</text>
  <rect x="534" y="566" width="414" height="40" rx="9" fill="#fff" stroke="#fde68a"/>
  <text x="546" y="584" font-size="12" font-weight="700" fill="#a16207">Legacy l10n directory (UNS.zip …)</text>
  <text x="546" y="599" font-size="10.5" fill="#ca8a04">complete but STALE — the reason for the OPUS-search pivot</text>

  <!-- browser bridge note -->
  <line x1="490" y1="369" x2="540" y2="369" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
