<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="250" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="6" rx="3" fill="url(#accent)"/>

  <text x="48" y="86" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="url(#title)">Tranzor</tspan><tspan fill="#f1f5f9"> Helper</tspan>
  </text>
  <text x="50" y="124" font-size="18" font-weight="600" fill="#94a3b8">A zero-install QA &amp; export cockpit for RingCentral localization</text>
  <text x="50" y="150" font-size="14.5" fill="#64748b">Python · tkinter · SQLite · PyInstaller — built AI-native with Claude Code</text>

  <!-- stat chips -->
  <g font-size="13" font-weight="600">
    <g transform="translate(50,182)">
      <rect width="150" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#e2e8f0" font-size="18" font-weight="800">~50.5K</text>
      <text x="14" y="37" fill="#94a3b8" font-size="11.5">lines of Python</text>
    </g>
    <g transform="translate(212,182)">
      <rect width="120" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#e2e8f0" font-size="18" font-weight="800">14</text>
      <text x="14" y="37" fill="#94a3b8" font-size="11.5">GUI tabs</text>
    </g>
    <g transform="translate(344,182)">
      <rect width="120" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#e2e8f0" font-size="18" font-weight="800">44</text>
      <text x="14" y="37" fill="#94a3b8" font-size="11.5">test files</text>
    </g>
    <g transform="translate(476,182)">
      <rect width="150" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#e2e8f0" font-size="18" font-weight="800">200</text>
      <text x="14" y="37" fill="#94a3b8" font-size="11.5">commits · 11 wks</text>
    </g>
    <g transform="translate(638,182)">
      <rect width="180" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#e2e8f0" font-size="18" font-weight="800">~85–95%</text>
      <text x="14" y="37" fill="#94a3b8" font-size="11.5">AI-generated code</text>
    </g>
  </g>

  <!-- platform badges right -->
  <g transform="translate(820,40)" font-size="12.5" font-weight="700">
    <rect width="132" height="28" rx="14" fill="#0b2a4a" stroke="#1d4ed8"/>
    <text x="16" y="19" fill="#bfdbfe">⊞ Windows .exe</text>
    <rect y="36" width="132" height="28" rx="14" fill="#1c1c2e" stroke="#6d28d9"/>
    <text x="16" y="55" fill="#ddd6fe">  macOS .app</text>
  </g>
</svg>
