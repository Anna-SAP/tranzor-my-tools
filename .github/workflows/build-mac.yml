name: Build Mac App

on:
  workflow_dispatch:  # 手动触发 — 在 GitHub 页面点击 Run workflow
  push:
    branches: [master]
    # 与 Windows 构建一致：黑名单触发 —— 新增任意 *.py 自动纳入构建；
    # 仅在改文档 / userscript / 托管 demo / Windows 专属文件时安静跳过。
    # （macOS runner 在私有仓库按 10× 计费，黑名单可避免无谓的 Mac 构建。）
    paths-ignore:
      - '**.md'                               # 全部 markdown 文档
      - 'userscript/**'                       # Tampermonkey 用户脚本（不打包到 .app）
      - 'public/**'                           # 托管 demo 网页（GitLab Pages）
      - '.gitlab-ci.yml'                      # GitLab Pages 部署配置
      - 'TranzorExporter.spec'                # Windows 构建 spec
      - '.github/workflows/build-windows.yml' # Windows 构建配置改动不需要重跑 Mac
      - 'LICENSE'
      - '.gitignore'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write  # rolling "master-latest" release (create/upload assets)
      actions: write   # prune step deletes this workflow's old artifacts

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests openpyxl pyinstaller

      - name: Build .app with PyInstaller
        run: |
          pyinstaller TranzorExporter_mac.spec --clean

      - name: Ad-hoc codesign the .app bundle
        # The bundle is built unsigned (spec has codesign_identity=None and no
        # Apple Developer ID is available in this repo). On macOS 15 Sequoia,
        # an unsigned + quarantined .app produces a Gatekeeper dialog with no
        # inline "Open Anyway" button. An ad-hoc signature does NOT satisfy
        # notarization, but it gives the universal2 bundle an internally
        # consistent signature so users can reliably bypass via
        # `xattr -dr com.apple.quarantine` or System Settings → Privacy &
        # Security → Open Anyway, and avoids the secondary "app is damaged"
        # failure mode. Long-term proper fix: enroll in Apple Developer
        # Program, store DEVELOPER_ID_APPLICATION cert + notarytool credentials
        # as repo secrets, and replace this with a real signature +
        # `xcrun notarytool submit --wait` + `xcrun stapler staple`.
        run: |
          codesign --force --deep --sign - dist/TranzorExporter.app
          codesign --verify --deep --strict --verbose=2 dist/TranzorExporter.app
          codesign -dv --verbose=4 dist/TranzorExporter.app || true

      - name: Package .app with ditto (preserves the .app bundle wrapper)
        # Why this step exists: actions/upload-artifact strips the top-level
        # directory when uploading a folder path, which on macOS means the
        # ".app" wrapper is lost and Finder ends up showing only the raw Unix
        # executable inside Contents/MacOS/. Wrapping the bundle with `ditto`
        # (Apple's native tool for .app packages — preserves symlinks,
        # executable bits and extended attributes) produces a single .zip
        # file; uploading that .zip keeps the full TranzorExporter.app
        # hierarchy intact end-to-end.
        run: |
          cd dist
          ditto -c -k --keepParent TranzorExporter.app TranzorExporter-Mac.zip
          ls -lh TranzorExporter-Mac.zip

      - name: Publish .app zip to rolling "master-latest" release
        # 2026-07-20 RCA: July's "Actions storage" GB-hour budget is spent
        # account-wide (see build-windows.yml for the full story). Release
        # assets are free and quota-independent — this is the reliable Mac
        # download channel; the artifact upload below is best-effort only.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view master-latest >/dev/null 2>&1; then
            # Both platform builds race to create it on first run — tolerate
            # "already exists" and just upload.
            gh release create master-latest --prerelease --target master \
              --title "Latest master build (rolling)" \
              --notes "Auto-updated on every master push. Assets are replaced in place, so download links are stable." \
              || echo "release create lost the race (already exists) - continuing"
          fi
          gh release upload master-latest dist/TranzorExporter-Mac.zip --clobber

      - name: Prune old TranzorExporter-Mac artifacts (keep newest 4)
        if: ${{ vars.ENABLE_ACTIONS_ARTIFACTS == 'true' }}
        # 2026-07-08: builds #123/#60 failed with "Artifact storage quota has
        # been hit" — see build-windows.yml for the full rationale. Bound
        # total artifact usage by keeping only the newest 4 per name.
        uses: actions/github-script@v8
        with:
          script: |
            const NAME = 'TranzorExporter-Mac', KEEP = 4;
            const arts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            const old = arts
              .filter(a => a.name === NAME && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(KEEP - 1);  // keep newest (KEEP-1); this run uploads one more
            for (const a of old) {
              core.info(`Deleting artifact ${a.id} (${a.name}, ${a.created_at})`);
              await github.rest.actions.deleteArtifact(
                { owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
            }
            core.info(`Pruned ${old.length} old artifact(s).`);

      - name: Upload TranzorExporter.app zip (optional Actions artifact)
        # Disabled by default while the account-wide Actions storage budget
        # is exhausted. The rolling release above remains the reliable
        # download channel. Set the repository variable
        # ENABLE_ACTIONS_ARTIFACTS=true to restore this secondary channel;
        # once enabled, a failed upload intentionally fails the job instead
        # of producing a misleading green run with a red error annotation.
        if: ${{ vars.ENABLE_ACTIONS_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: TranzorExporter-Mac
          path: dist/TranzorExporter-Mac.zip
          retention-days: 7  # repo cap is 7 anyway; the prune step above is the real bound
