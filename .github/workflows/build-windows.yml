name: Build Windows EXE

on:
  workflow_dispatch:  # 手动触发 — 在 GitHub Actions 页面点击 Run workflow
  push:
    branches: [master]
    # 用「黑名单」而不是「白名单」：默认所有代码改动都触发构建，只显式
    # 排除明确不影响 EXE 的路径。
    #
    # 历史上这里是一份白名单（``paths:``），列出"已知"的源文件。问题是
    # 每加一个新 *.py（如 gui_tab_tranzor_checks.py / opus_id_monitor.py
    # 等等）都得记得追加这份清单 —— 一旦遗漏，对应 PR 合到 master 后就
    # **不会触发自动构建**，用户必须手动点 Run workflow，与"代码变更
    # 自动出包"的预期不符。
    #
    # 改成 ``paths-ignore`` 后，新增任何 *.py 自动纳入触发集；只有改文档 /
    # userscript / Mac 专属文件时才安静跳过。
    paths-ignore:
      - '**.md'                              # 全部 markdown 文档
      - 'userscript/**'                      # Tampermonkey 用户脚本（不打包到 EXE）
      - 'build_mac.command'                  # Mac 专属构建脚本
      - 'TranzorExporter_mac.spec'           # Mac 构建 spec
      - '.github/workflows/build-mac.yml'    # Mac 构建配置改动不需要重跑 Windows
      - 'LICENSE'
      - '.gitignore'
      - 'public/**'                          # 托管 demo 网页（GitLab Pages，不打包到 EXE）
      - '.gitlab-ci.yml'                     # GitLab Pages 部署配置

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # rolling "master-latest" release (create/upload assets)
      actions: write   # prune step deletes this workflow's old artifacts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests openpyxl pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller TranzorExporter.spec --clean

      - name: Verify EXE exists
        shell: pwsh
        run: |
          # Onefile layout: dist/TranzorExporter.exe (a single file, no _internal/).
          # Back from a brief onedir experiment in PR #64 — the folder-based
          # distribution kept tripping users into double-clicking the .exe
          # straight out of the .zip viewer, which extracts only the .exe and
          # then fails to find _internal\python312.dll. Onefile is foolproof.
          $exe = Get-Item "dist\TranzorExporter.exe" -ErrorAction Stop
          $sizeMB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Built EXE: $($exe.FullName) ($sizeMB MB)"

      - name: Publish EXE to rolling "master-latest" release
        # 2026-07-20 RCA: the account's July "Actions storage" allowance is a
        # CUMULATIVE monthly GB-hour budget on the enhanced billing platform
        # (366 GBh consumed of ~365 included) — deleting artifacts cannot
        # refund it, so every upload-artifact stayed red and would until
        # Aug 1. Release assets are free and outside that quota, so this
        # rolling prerelease is the RELIABLE download channel with a stable
        # URL; the artifact upload below is best-effort only.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view master-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            # Both platform builds race to create it on first run — tolerate
            # "already exists" and just upload.
            gh release create master-latest --prerelease --target master --title "Latest master build (rolling)" --notes "Auto-updated on every master push. Assets are replaced in place, so download links are stable."
            if ($LASTEXITCODE -ne 0) { Write-Host "release create lost the race (already exists) - continuing" }
          }
          gh release upload master-latest dist/TranzorExporter.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Prune old TranzorExporter-Windows artifacts (keep newest 4)
        # 2026-07-08: builds #123/#60 failed with "Artifact storage quota has
        # been hit" — retention-days alone doesn't bound usage on busy days
        # (repo cap is 7 days; 4 builds/day × ~37MB/pair blows the 500MB
        # private-repo quota). Delete all but the newest 4 same-name artifacts
        # BEFORE uploading so total usage stays bounded (~150MB) forever.
        uses: actions/github-script@v7
        with:
          script: |
            const NAME = 'TranzorExporter-Windows', KEEP = 4;
            const arts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            const old = arts
              .filter(a => a.name === NAME && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(KEEP - 1);  // keep newest (KEEP-1); this run uploads one more
            for (const a of old) {
              core.info(`Deleting artifact ${a.id} (${a.name}, ${a.created_at})`);
              await github.rest.actions.deleteArtifact(
                { owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
            }
            core.info(`Pruned ${old.length} old artifact(s).`);

      - name: Upload TranzorExporter EXE (best-effort artifact channel)
        # May fail while the monthly storage budget is exhausted — the
        # release above is the channel that must succeed, so don't let this
        # step turn the run red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TranzorExporter-Windows
          path: dist/TranzorExporter.exe
          retention-days: 7  # repo cap is 7 anyway; the prune step above is the real bound
