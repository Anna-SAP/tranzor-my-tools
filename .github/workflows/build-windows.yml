name: Build Windows EXE

on:
  workflow_dispatch:  # 手动触发 — 在 GitHub Actions 页面点击 Run workflow
  push:
    branches: [master]
    # 用「黑名单」而不是「白名单」：默认所有代码改动都触发构建，只显式
    # 排除明确不影响 EXE 的路径。
    #
    # 历史上这里是一份白名单（``paths:``），列出"已知"的源文件。问题是
    # 每加一个新 *.py（如 gui_tab_tranzor_checks.py / opus_id_monitor.py
    # 等等）都得记得追加这份清单 —— 一旦遗漏，对应 PR 合到 master 后就
    # **不会触发自动构建**，用户必须手动点 Run workflow，与"代码变更
    # 自动出包"的预期不符。
    #
    # 改成 ``paths-ignore`` 后，新增任何 *.py 自动纳入触发集；只有改文档 /
    # userscript / Mac 专属文件时才安静跳过。
    paths-ignore:
      - '**.md'                              # 全部 markdown 文档
      - 'userscript/**'                      # Tampermonkey 用户脚本（不打包到 EXE）
      - 'build_mac.command'                  # Mac 专属构建脚本
      - 'TranzorExporter_mac.spec'           # Mac 构建 spec
      - '.github/workflows/build-mac.yml'    # Mac 构建配置改动不需要重跑 Windows
      - 'LICENSE'
      - '.gitignore'
      - 'public/**'                          # 托管 demo 网页（GitLab Pages，不打包到 EXE）
      - '.gitlab-ci.yml'                     # GitLab Pages 部署配置

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests openpyxl pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller TranzorExporter.spec --clean

      - name: Verify EXE exists
        shell: pwsh
        run: |
          # Onefile layout: dist/TranzorExporter.exe (a single file, no _internal/).
          # Back from a brief onedir experiment in PR #64 — the folder-based
          # distribution kept tripping users into double-clicking the .exe
          # straight out of the .zip viewer, which extracts only the .exe and
          # then fails to find _internal\python312.dll. Onefile is foolproof.
          $exe = Get-Item "dist\TranzorExporter.exe" -ErrorAction Stop
          $sizeMB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Built EXE: $($exe.FullName) ($sizeMB MB)"

      - name: Upload TranzorExporter EXE
        uses: actions/upload-artifact@v4
        with:
          name: TranzorExporter-Windows
          path: dist/TranzorExporter.exe
          retention-days: 90

      # Publish the freshly-built EXE to the company GitLab so colleagues can
      # grab it without GitHub access. This is a pure HTTPS API call from the
      # GitHub-hosted runner — it does NOT need a GitLab CI runner. The binary
      # goes into the generic package registry (no attachment-size limit) and a
      # per-commit GitLab Release links to it. Windows + macOS jobs share the
      # same commit SHA, so both land under one release "build-<sha>".
      - name: Publish to GitLab Release
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::warning::GITLAB_TOKEN secret not set yet — skipping GitLab publish (build + artifact still succeed). Add a GitLab project access token (scope 'api') in GitHub repo Settings → Secrets and variables → Actions to enable it."
            exit 0
          fi
          HOST="https://git.ringcentral.com"
          PID=40545
          BASE="$HOST/api/v4/projects/$PID"
          SHA8="${GITHUB_SHA:0:8}"
          TAG="build-$SHA8"
          REL_NAME="Build $(date -u +%Y-%m-%d) ($SHA8)"
          FILE="dist/TranzorExporter.exe"
          PKG_URL="$BASE/packages/generic/tranzor-helper/$SHA8/TranzorExporter-windows.exe"
          LINK_NAME="Windows EXE (.exe)"

          echo "--> Uploading $FILE to the GitLab generic package registry"
          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --upload-file "$FILE" "$PKG_URL"

          echo "--> Ensuring release $TAG exists"
          curl --silent --show-error --request POST \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "name=$REL_NAME" \
            --data-urlencode "tag_name=$TAG" \
            --data-urlencode "ref=master" \
            --data-urlencode "description=Automated build from master @ $GITHUB_SHA" \
            "$BASE/releases" || echo "    (release likely already created by the macOS job — continuing)"

          echo "--> Attaching '$LINK_NAME' to the release"
          curl --silent --show-error --request POST \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "name=$LINK_NAME" \
            --data-urlencode "url=$PKG_URL" \
            "$BASE/releases/$TAG/assets/links" \
            && echo "Published: $REL_NAME -> $LINK_NAME" \
            || echo "    (asset link may already exist — continuing)"
