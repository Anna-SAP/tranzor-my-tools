variables:
  # Work around the Windows PowerShell shell runner failing while exporting
  # merge-commit metadata before checkout. The Pages job does not use these.
  CI_COMMIT_TITLE: "pages deploy"
  CI_COMMIT_MESSAGE: "pages deploy"
  CI_COMMIT_DESCRIPTION: "pages deploy"

pages:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Publishing Tranzor MR Pipeline demo to GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
